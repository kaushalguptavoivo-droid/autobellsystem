name: Build Windows EXE

# Runs automatically whenever you push to GitHub, and can also be
# triggered manually from the "Actions" tab ("Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AutoBellSystem/AutoBellSystem.csproj

      - name: Publish self-contained EXE
        run: dotnet publish AutoBellSystem/AutoBellSystem.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBellSystem-Windows-x64
          path: publish/AutoBellSystem.exe
